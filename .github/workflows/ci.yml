name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    name: Vet + Test + Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -o stocksh.exe .

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -o stocksh-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: stocksh-${{ matrix.os }}
          path: |
            stocksh.exe
            stocksh-linux

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Windows binary
        run: go build -C . -o stocksh.exe .
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Build Linux binary
        run: go build -o stocksh-linux .
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Build macOS binary
        run: go build -o stocksh-mac .
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stocksh.exe
            stocksh-linux
            stocksh-mac
          generate_release_notes: true